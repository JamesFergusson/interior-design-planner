name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build skill zip
        run: cd plugins/interior-design-planner/skills && zip -r ../../../room-planner.zip room-planner -x "*/__pycache__/*"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            tests/output
            room-planner.zip
